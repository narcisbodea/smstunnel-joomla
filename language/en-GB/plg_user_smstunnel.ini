PLG_USER_SMSTUNNEL="User - SMSTunnel"
PLG_USER_SMSTUNNEL_APIKEY_LABEL="API key"
PLG_USER_SMSTUNNEL_APIKEY_DESC="The API key from your SMSTunnel dashboard (Apps &rarr; Add an app). It is used only to send texts and never leaves your server except to smstunnel.io."
PLG_USER_SMSTUNNEL_RECIPIENTS_LABEL="Text these numbers"
PLG_USER_SMSTUNNEL_RECIPIENTS_DESC="The number or numbers to notify about a new registration, in international format (+40721234567), separated by commas. Each one gets its own text."
PLG_USER_SMSTUNNEL_COUNTRYCODE_LABEL="Default country code"
PLG_USER_SMSTUNNEL_COUNTRYCODE_DESC="Completes numbers written without + or 00, for example +40. Numbers already in international format need none."
PLG_USER_SMSTUNNEL_DEVICEID_LABEL="Phone (optional)"
PLG_USER_SMSTUNNEL_DEVICEID_DESC="The ID of the phone that should send the texts, copied from Phones in your SMSTunnel dashboard. Leave it empty to let SMSTunnel use any of your online phones."
PLG_USER_SMSTUNNEL_TEMPLATE_LABEL="Message"
PLG_USER_SMSTUNNEL_TEMPLATE_DESC="The text to send. You can use the placeholders {name}, {username}, {email} and {sitename}."
PLG_USER_SMSTUNNEL_SITEONLY_LABEL="Only self-registrations"
PLG_USER_SMSTUNNEL_SITEONLY_DESC="Yes: send a text only when a visitor registers on the site, not when an administrator creates an account in the back end."
